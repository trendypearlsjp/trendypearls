name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: https://wqcjmejtebgpotbkjpsv.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndxY2ptZWp0ZWJncG90YmtqcHN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzAwNDEsImV4cCI6MjEwMDkwNjA0MX0.DYTnoXv4agF5MGoKZrKv1PWjWij991mJTWRy7DCEoeU
          VITE_CLOUDINARY_CLOUD_NAME: rtcqltge
          VITE_CLOUDINARY_UPLOAD_PRESET: trendy_products
          VITE_WHATSAPP_NUMBER: 919037352739
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
